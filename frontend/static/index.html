<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>EkaCI</title>

        <!--
        Apply a saved light/dark override before first paint so the page never
        flashes the wrong theme. Without one, the stylesheet follows the OS.
        -->
        <script>
            try {
                var savedTheme = window.localStorage.getItem('ekaci_theme');
                if (savedTheme === 'light' || savedTheme === 'dark') {
                    document.documentElement.dataset.theme = savedTheme;
                }
            } catch (e) {}
        </script>

        <link rel="stylesheet" href="/styles/main.css" />

        <!--
        The server is configured to try and serve all files that are in this directory
        first. It will only fall back to serving this index file if it cannot find the
        requested path.
        -->
        <script src="/main.js"></script>
        <script type="module">
            import { readTheme, setupPorts } from '/ports.js';

            // Calculate API base URL from current location
            // This allows the frontend to work whether served directly or via reverse proxy
            const apiBaseUrl = `${window.location.origin}/v1`;

            // Initialize the Elm application with configuration
            const app = Elm.Main.init({
                flags: {
                    apiBaseUrl: apiBaseUrl,
                    theme: readTheme()
                }
            });

            // Set up WebSocket, token and theme ports
            setupPorts(app);
        </script>
    </head>
    <body>
    </body>
</html>
