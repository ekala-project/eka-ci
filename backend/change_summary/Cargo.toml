[package]
name = "change_summary"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace dependencies
shared = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Other workspace crates
graph = { path = "../graph" }
evaluator = { path = "../evaluator" }

# Database operations
sqlx = { version = "0.8.5", features = ["runtime-tokio", "sqlite"], default-features = false }

# Timestamps
chrono = { version = "0.4.40", default-features = false, features = ["now", "std"] }

# Async runtime
tokio = { version = "1.41.0", features = ["full"] }

# Metrics (optional)
prometheus = { version = "0.13", optional = true }

[features]
default = []
metrics = ["prometheus"]

[dev-dependencies]
tokio = { version = "1.41.0", features = ["full", "test-util"] }
tempfile = "3"
